# Tests à chaque push et chaque pull request : démarrage (et autres tests rapides), partie complète du robot, duels.
name: Tests de démarrage

on:
  push:
    branches: [main]
  pull_request:

jobs:
  demarrage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Installer Playwright et Chromium
        run: |
          npm i --no-save playwright
          npx playwright install --with-deps chromium
      - name: Vérifier que le nom du cache change quand une image change
        run: node tests/test_cache.js
      - name: Tester les réglages à distance (assistant, commandes, règles Firebase)
        run: node tests/test_config.js
      - name: Lancer le test
        run: node tests/test_demarrage.js
      - name: Lancer le test de la page de stats (bouton de réinitialisation)
        run: node tests/test_stats_reset.js
      - name: Lancer le test du spectateur (Regarder une partie en ligne)
        run: node tests/test_spectateur.js
      - name: Lancer le test du profil joueur (connexion Google simulée, sauvegarde de la progression)
        run: node tests/test_profil.js
      - name: Lancer le test des langues (dictionnaires anglais, espagnol, italien et politique de confidentialité)
        run: node tests/test_langue.js
      - name: Lancer le test de l'écran « Mes défis » (défis personnalisés)
        run: node tests/test_defis_ecran.js

  partie-robot:
    # Une partie complète jouée par le robot dans 5 configurations (debout, paysage, accessibilité, petit écran)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Installer Playwright et Chromium
        run: |
          npm i --no-save playwright
          npx playwright install --with-deps chromium
      - name: Lancer les parties du robot
        run: node tests/test_partie_robot.js

  duels:
    # Les duels Shifumi et Réflexe en mode classique (un seul téléphone, sans Firebase) : choix du duel, égalités,
    # faux départ, gorgées, défis hot / hard selon les gorgées finales, bot, reprise d'une partie coupée
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Installer Playwright et Chromium
        run: |
          npm i --no-save playwright
          npx playwright install --with-deps chromium
      - name: Duel Shifumi (classique)
        run: node tests/test_shifumi_classique.js
      - name: Duel Shifumi en mode hot, hard et PJ
        run: node tests/test_shifumi_hot.js
      - name: Duel Réflexe (classique)
        run: node tests/test_reflexe_classique.js
